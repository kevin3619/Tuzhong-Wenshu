# ============================================
# Tuzhong Wenshu - Nginx Reverse Proxy Config
# Domain: tuzhongwang.xyz
# Backend: Next.js (localhost:3001)
# ============================================
# NOTE: First deployment may not have SSL certs yet.
#       This config works for both HTTP and HTTPS.
#       After running certbot, HTTPS block will be auto-configured.
# ============================================

# HTTP Server (main entry, also handles SSL cert verification)
server {
    listen 80;
    listen [::]:80;
    server_name tuzhongwang.xyz www.tuzhongwang.xyz;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Upload size limit
    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root redirect to /tuzhong-wenshu/
    location = / {
        return 302 /tuzhong-wenshu/;
    }

    # Main reverse proxy: forward all /tuzhong-wenshu/ requests to Next.js
    location /tuzhong-wenshu/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings (AI generation needs long processing time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Static assets caching (basePath aware)
    location /tuzhong-wenshu/_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon.ico (basePath aware)
    location = /tuzhong-wenshu/favicon.ico {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
        log_not_found off;
    }

    # favicon.svg (basePath aware)
    location = /tuzhong-wenshu/favicon.svg {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
        log_not_found off;
    }
}
